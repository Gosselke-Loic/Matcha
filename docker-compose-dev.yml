services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      #- uploads:/usr/share/nginx/html/uploads:ro
    restart: unless-stopped
    networks:
      - public
      - private
    depends_on:
      - frontend

  frontend:
    build:
      context : ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - private

networks:
  public:
    driver: bridge
  private:
    internal: true
    driver: bridge

volumes:
  db_data:
  uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/uploads

secrets:
  db-password:
    file: ./secrets/db_password.txt
