services:
  frontend-prod:
    build:
      context : ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./backend
    command: gunicorn --bind 0.0.0.0:5000 manage:app
    container_name: api-backend
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - 5001:5000
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:16
    volumes:
      - db_data:/var/lib/postgresql/data/
    restart: always
    secrets:
      - db-password
    environment:
      POSTGRES_DB: matcha
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
      POSTGRES_USER: matcha_user
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matcha_user -d matcha"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:



secrets:
  db-password:
    file: ./secrets/db_password.txt